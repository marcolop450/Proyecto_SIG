  <text x="690" y="709" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">VisorDatosSIG.Infrastructure (Servicios e Integración)</text>
  
  <text x="495" y="735" font-size="11" font-weight="bold" fill="#0369A1">+ GeoDataService : IGeoDataService</text>
  <text x="510" y="752" font-size="10" fill="#334155">- Consultas SQL nativas de alto rendimiento con Dapper</text>
  <text x="510" y="768" font-size="10" fill="#334155">- STAsText, STContains y serialización GeoJSON optimizada</text>

  <text x="495" y="800" font-size="11" font-weight="bold" fill="#0369A1">+ AuthService : IAuthService</text>
  <text x="510" y="817" font-size="10" fill="#334155">- PBKDF2 (Rfc2898DeriveBytes) SHA256 con 100,000 iteraciones</text>
  <text x="510" y="833" font-size="10" fill="#334155">- CryptographicOperations.FixedTimeEquals (Timing attack safe)</text>
  <text x="510" y="849" font-size="10" fill="#334155">- Carga jerárquica de permisos de navegación RBAC</text>

