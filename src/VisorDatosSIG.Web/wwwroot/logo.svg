<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Diamond background with rounded corners and gold border -->
  <rect x="21" y="21" width="58" height="58" rx="13" transform="rotate(45 50 50)" fill="#F6F4EE" stroke="#B8892C" stroke-width="3.5" />
  
  <!-- Compass body -->
  <g transform="translate(50,50)">
    <!-- Top crown / button -->
    <rect x="-3.5" y="-20" width="7" height="3.5" rx="1" fill="#B8892C" />
    <!-- Outer compass ring -->
    <circle cx="0" cy="0" r="17.5" fill="none" stroke="#B8892C" stroke-width="3.2" />
    <!-- Rotated needle (~40 degrees) -->
    <g transform="rotate(40)">
      <!-- North pointer -->
      <polygon points="0,-12 3.2,0 0,0" fill="#996E17" />
      <polygon points="0,-12 0,0 -3.2,0" fill="#B8892C" />
      <!-- South pointer -->
      <polygon points="0,12 3.2,0 0,0" fill="#D4AE58" />
      <polygon points="0,12 0,0 -3.2,0" fill="#B8892C" />
      <circle cx="0" cy="0" r="2.2" fill="#7A5612" />
    </g>
  </g>
</svg>
